name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Ruff
        run: poetry run ruff check .

  test:
    name: Pytest (coverage ≥70%)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakoda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bakoda_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bakoda_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Pytest with coverage
        run: >-
          poetry run pytest
          --cov=src
          --cov-report=term-missing
          --cov-fail-under=70
          -v
          --ignore=tests/e2e

  docker-smoke-newman:
    name: Docker, smoke, Newman
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t bakoda:${{ github.sha }} .

      - name: Docker Compose up
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "App healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "Waiting for app... ($i/60)"
            sleep 5
          done
          docker compose ps
          docker compose logs app --tail 100
          exit 1

      - name: Smoke test /health
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Seed database (Newman booking flow)
        run: docker compose exec -T app python scripts/seed.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman

      - name: Newman Postman collection
        run: newman run postman/collection.json --env-var baseUrl=http://localhost:8000

      - name: Docker Compose down
        if: always()
        run: docker compose down -v

  deploy-minikube:
    name: Deploy to Minikube + smoke
    runs-on: ubuntu-latest
    needs: docker-smoke-newman
    steps:
      - uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Build image into Minikube
        run: |
          docker build -t bakoda:latest .
          minikube image load bakoda:latest

      - name: Deploy PostgreSQL (dependency for the app)
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    env:
                      - name: POSTGRES_USER
                        value: postgres
                      - name: POSTGRES_PASSWORD
                        value: postgres
                      - name: POSTGRES_DB
                        value: bakoda
                    ports:
                      - containerPort: 5432
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-U", "postgres", "-d", "bakoda"]
                      initialDelaySeconds: 5
                      periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-service
            labels:
              app: postgres
          spec:
            selector:
              app: postgres
            ports:
              - protocol: TCP
                port: 5432
                targetPort: 5432
          EOF
          kubectl rollout status deployment/postgres --timeout=180s

      - name: Apply application manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/bakoda --timeout=300s

      - name: Smoke test /health via Minikube service
        run: |
          BASE_URL="$(minikube service bakoda-service --url)"
          echo "Service URL: ${BASE_URL}"
          for i in $(seq 1 30); do
            if curl -sf "${BASE_URL}/health" | grep -q '"status":"ok"'; then
              echo "App healthy in cluster after ${i} attempt(s)"
              curl -sf "${BASE_URL}/health"
              exit 0
            fi
            echo "Waiting for /health... ($i/30)"
            sleep 5
          done
          echo "Smoke test failed — dumping cluster state"
          kubectl get pods -o wide
          kubectl describe deployment/bakoda
          kubectl logs deployment/bakoda --tail=100 || true
          exit 1

      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl get all
          kubectl get events --sort-by=.lastTimestamp | tail -50

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Pytest + Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==1.8.5
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run tests with coverage
        run: poetry run pytest --cov=src --cov-report=term-missing --cov-fail-under=70 -v --ignore=tests/e2e
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── 3. Docker Build ────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bakoda:${{ github.sha }} .
      - name: Save image
        run: docker save bakoda:${{ github.sha }} -o bakoda.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: bakoda.tar

  # ── 4. Newman (Postman) ────────────────────────────────────────────────────
  newman:
    name: Newman / Postman Tests
    runs-on: ubuntu-latest
    needs: docker-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakoda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load -i bakoda.tar
      - name: Start app
        run: |
          docker run -d --name bakoda \
            --network host \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/bakoda \
            -e S3_ENDPOINT_URL=http://localhost:4566 \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e S3_BUCKET_NAME=bakoda-confirmations \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 \
            bakoda:${{ github.sha }}
          sleep 5
      - name: Install Newman
        run: npm install -g newman
      - name: Run Postman collection
        run: newman run postman/collection.json --env-var baseUrl=http://localhost:8000 --reporters cli

  # ── 5. Smoke Test ──────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: newman
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakoda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load -i bakoda.tar
      - name: Start app
        run: |
          docker run -d --name bakoda \
            --network host \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/bakoda \
            -e S3_ENDPOINT_URL=http://localhost:4566 \
            -e AWS_ACCESS_KEY_ID=test \
            -e AWS_SECRET_ACCESS_KEY=test \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e S3_BUCKET_NAME=bakoda-confirmations \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 \
            bakoda:${{ github.sha }}
          sleep 8
      - name: Smoke test /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          echo "Health status: $STATUS"
          [ "$STATUS" = "200" ]
      - name: Smoke test /rooms
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/rooms)
          echo "Rooms status: $STATUS"
          [ "$STATUS" = "200" ]

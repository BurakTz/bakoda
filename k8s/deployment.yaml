apiVersion: apps/v1
kind: Deployment
metadata:
  name: bakoda
  labels:
    app: bakoda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bakoda
  template:
    metadata:
      labels:
        app: bakoda
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: bakoda
          image: bakoda:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bakoda-config
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kayıt Ol — bakoda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #0F2A2A;
      --primary-90: #1a3838;
      --primary-10: #e4ebeb;
      --accent: #D7A86E;
      --accent-dark: #b88a52;
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #2C3E50;
      --muted: #8A9BB0;
      --line: #ECEAE3;
      --success: #2ECC71;
      --error: #E74C3C;

      --display: "Fraunces", "Playfair Display", Georgia, serif;
      --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

      --r-btn: 8px;
      --r-input: 10px;
      --r-pill: 999px;

      --shadow-card: 0 1px 2px rgba(15,42,42,0.04), 0 12px 36px rgba(15,42,42,0.10);
      --ease: cubic-bezier(.4,.0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; min-height: 100vh; }
    h1, h2, h3, h4 { font-family: var(--display); margin: 0; color: var(--primary); letter-spacing: -0.01em; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      height: 50px; padding: 0 22px; border-radius: var(--r-btn); border: 0; font-weight: 500; font-size: 15px; cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), color .2s var(--ease), border-color .2s; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-90); }
    .btn-cta { background: var(--accent); color: #fff; font-weight: 600; }
    .btn-cta:hover { background: var(--accent-dark); box-shadow: 0 8px 22px rgba(215,168,110,.35); }

    /* ── Layout: 45 / 55 split ── */
    .stage {
      display: grid; grid-template-columns: 45% 55%; min-height: 100vh;
    }
    @media (max-width: 880px) { .stage { grid-template-columns: 1fr; } }

    /* ── Left brand pane ── */
    .brand-pane {
      background: var(--primary); color: #fff; position: relative; overflow: hidden;
      padding: 48px 56px; display: flex; flex-direction: column; min-height: 100vh;
    }
    @media (max-width: 880px) {
      .brand-pane { min-height: auto; padding: 36px 32px 44px; }
    }
    @media (max-width: 540px) { .brand-pane { padding: 28px 22px 32px; } }

    /* Subtle stripe texture for the brand pane */
    .brand-pane::before {
      content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 1px, transparent 1px 16px);
      pointer-events: none;
    }
    /* Two ambient gold glows */
    .brand-pane::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 20% 100%, rgba(215,168,110,.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 90% 0%, rgba(215,168,110,.10) 0%, transparent 60%);
    }

    .brand-pane > * { position: relative; z-index: 1; }

    .brand-logo { font-family: var(--display); font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -.015em; line-height: 1; }
    .brand-logo .dot { color: var(--accent); }
    .brand-mark { display: inline-flex; align-items: center; gap: 8px; }
    .brand-mark::before {
      content: ""; width: 10px; height: 10px; border-radius: 999px; background: var(--accent);
      box-shadow: 0 0 0 3px rgba(215,168,110,.22);
    }

    .brand-pane .middle {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 60px 0;
    }
    @media (max-width: 880px) { .brand-pane .middle { padding: 36px 0 28px; } }

    .brand-eyebrow {
      font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: rgba(255,255,255,.6); margin-bottom: 24px;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .brand-eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); display: inline-block; }

    .brand-title {
      font-family: var(--display); font-size: clamp(34px, 3.8vw, 48px); font-weight: 500;
      line-height: 1.1; letter-spacing: -.02em; color: #fff; max-width: 14ch;
    }
    .brand-title em { font-style: italic; color: var(--accent); font-weight: 400; }

    .brand-sub {
      margin-top: 22px; max-width: 32ch;
      color: rgba(255,255,255,.78); font-size: 15px; line-height: 1.65;
    }

    .brand-quote {
      margin-top: 36px; padding: 22px 24px; border-left: 2px solid var(--accent);
      background: rgba(255,255,255,.04); border-radius: 0 12px 12px 0;
      font-family: var(--display); font-size: 16px; font-style: italic; line-height: 1.5; color: rgba(255,255,255,.92);
      max-width: 36ch;
    }
    .brand-quote .who {
      display: block; margin-top: 12px; font-family: var(--mono); font-style: normal;
      font-size: 11px; letter-spacing: .08em; color: rgba(255,255,255,.55); text-transform: uppercase;
    }

    /* Social proof */
    .proof {
      display: flex; align-items: center; gap: 16px; margin-top: auto;
      padding-top: 28px; border-top: 1px solid rgba(255,255,255,.10);
    }
    @media (max-width: 880px) { .proof { padding-top: 24px; } }

    .avatars { display: flex; align-items: center; }
    .avatars .av {
      width: 40px; height: 40px; border-radius: 999px; border: 2px solid var(--primary);
      display: grid; place-items: center; color: #fff; font-family: var(--display);
      font-weight: 600; font-size: 13px; flex-shrink: 0; position: relative;
    }
    .avatars .av + .av { margin-left: -12px; }
    .av-1 { background: linear-gradient(135deg, #c9a96e 0%, #a07c4f 100%); }
    .av-2 { background: linear-gradient(135deg, #2c5f5a 0%, #163838 100%); }
    .av-3 { background: linear-gradient(135deg, #b76b4e 0%, #6f3b3b 100%); }
    .av-more {
      background: rgba(255,255,255,.10); color: rgba(255,255,255,.85);
      font-family: var(--mono); font-size: 11px; font-weight: 600;
    }

    .proof-text { color: rgba(255,255,255,.86); font-size: 14px; line-height: 1.4; }
    .proof-text b { display: block; color: #fff; font-weight: 600; font-family: var(--display); font-size: 17px; letter-spacing: -.005em; }
    .proof-text .stars { color: var(--accent); font-size: 12px; letter-spacing: 1px; margin-top: 2px; }

    /* ── Right form pane ── */
    .form-pane {
      display: flex; align-items: center; justify-content: center;
      padding: 48px 56px; background: var(--bg); min-height: 100vh;
      position: relative;
    }
    @media (max-width: 880px) { .form-pane { padding: 36px 28px; min-height: auto; } }
    @media (max-width: 540px) { .form-pane { padding: 28px 22px 44px; } }

    .form-pane::before { /* very subtle paper grain */
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .4;
      background-image: repeating-linear-gradient(135deg, rgba(15,42,42,.02) 0 1px, transparent 1px 14px);
    }
    .form-pane > * { position: relative; }

    .form-box { width: 100%; max-width: 420px; }

    .form-pane .top-link {
      position: absolute; top: 28px; right: 32px; font-size: 13px; color: var(--muted);
    }
    .form-pane .top-link a { color: var(--primary); font-weight: 500; text-decoration: underline; text-decoration-color: rgba(15,42,42,.25); text-underline-offset: 3px; }
    .form-pane .top-link a:hover { text-decoration-color: var(--primary); }
    @media (max-width: 540px) { .form-pane .top-link { position: static; text-align: right; margin-bottom: 24px; } }

    .form-eyebrow {
      font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .form-eyebrow::before { content: ""; width: 20px; height: 1px; background: var(--accent); display: inline-block; }

    .form-title { font-size: 32px; font-weight: 600; line-height: 1.1; letter-spacing: -.015em; }
    .form-sub { color: var(--muted); margin: 10px 0 32px; font-size: 15px; }

    /* Google button */
    .btn-google {
      width: 100%; background: #fff; color: var(--text);
      border: 1px solid var(--line); height: 52px; font-weight: 500; font-size: 14.5px;
      gap: 12px; transition: border-color .15s, box-shadow .2s var(--ease), transform .15s;
    }
    .btn-google:hover { border-color: rgba(15,42,42,.25); box-shadow: 0 6px 20px rgba(15,42,42,.10); transform: translateY(-1px); }
    .btn-google:active { transform: translateY(0); }

    /* Apple button (secondary social option) */
    .btn-apple {
      width: 100%; background: #111; color: #fff; border: 1px solid #111;
      height: 52px; font-weight: 500; font-size: 14.5px; gap: 10px;
    }
    .btn-apple:hover { background: #000; }

    .social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 540px) { .social-row { grid-template-columns: 1fr; } }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 14px; margin: 22px 0;
      color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* Form fields */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field + .field { margin-top: 14px; }
    .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .fields-row > .field + .field { margin-top: 0; }
    .field label {
      font-size: 13px; font-weight: 500; color: var(--text);
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .field label a { font-size: 12px; color: var(--primary); font-weight: 500; }
    .field label a:hover { color: var(--accent-dark); }
    .field-affix {
      position: relative;
    }
    .field-affix .ico {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    .field-affix .toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent;
      cursor: pointer; color: var(--muted); display: grid; place-items: center;
    }
    .field-affix .toggle:hover { background: rgba(15,42,42,.06); color: var(--text); }
    .input {
      width: 100%; height: 50px; padding: 0 14px 0 44px;
      border: 1px solid var(--line); border-radius: var(--r-input); background: #fff;
      font: inherit; font-size: 14.5px; color: var(--text); outline: none;
      transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
    }
    .input.no-affix { padding-left: 14px; }
    .input.has-toggle { padding-right: 48px; }
    .input:hover { border-color: rgba(15,42,42,.4); }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(215,168,110,.22); }
    .input.err { border-color: var(--error); }
    .input.err:focus { box-shadow: 0 0 0 3px rgba(231,76,60,.16); }
    .input::placeholder { color: var(--muted); }
    .err-msg { font-size: 12px; color: var(--error); display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; }

    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0 22px; flex-wrap: wrap; }
    .remember { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text); }
    .remember input { position: absolute; opacity: 0; pointer-events: none; }
    .remember .box {
      width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); background: #fff;
      display: grid; place-items: center; transition: background .15s, border-color .15s; flex-shrink: 0;
    }
    .remember:hover .box { border-color: var(--primary); }
    .remember input:checked ~ .box { background: var(--primary); border-color: var(--primary); }
    .remember input:checked ~ .box svg { opacity: 1; }
    .remember .box svg { opacity: 0; transition: opacity .15s; }
    .forgot {
      font-size: 13px; color: var(--primary); font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px;
      transition: gap .2s var(--ease), color .15s;
    }
    .forgot:hover { color: var(--accent-dark); gap: 7px; }

    .signup-line { text-align: center; margin-top: 28px; font-size: 14px; color: var(--muted); }
    .signup-line a { color: var(--primary); font-weight: 600; text-decoration: underline; text-decoration-color: rgba(15,42,42,.3); text-underline-offset: 3px; }
    .signup-line a:hover { text-decoration-color: var(--primary); }

    .legal { text-align: center; margin-top: 28px; font-size: 11px; font-family: var(--mono); letter-spacing: .04em; color: var(--muted); line-height: 1.6; }
    .legal a { color: var(--primary); text-decoration: underline; text-decoration-color: rgba(15,42,42,.25); }
    .legal a:hover { text-decoration-color: var(--primary); }

    /* Toast */
    .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-12px); opacity: 0;
      background: var(--primary); color: #fff; padding: 12px 20px; border-radius: var(--r-pill);
      box-shadow: 0 12px 32px rgba(15,42,42,.4); z-index: 200; font-size: 14px;
      transition: opacity .25s var(--ease), transform .25s var(--ease); pointer-events: none;
      display: inline-flex; align-items: center; gap: 10px; }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .ok { width: 18px; height: 18px; border-radius: 999px; background: var(--success); color: #fff; display: grid; place-items: center; font-size: 11px; }

    .fade-in { animation: fadeIn .5s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Password strength */
    .pw-strength { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .pw-bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .pw-bar { height: 4px; border-radius: 999px; background: var(--line); transition: background .2s var(--ease); }
    .pw-meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
    .pw-label { font-weight: 600; }
    .pw-label.l-1 { color: var(--error); }
    .pw-label.l-2 { color: #c98a2a; }
    .pw-label.l-3 { color: #c98a2a; }
    .pw-label.l-4 { color: #1e8e51; }
    .pw-bar.l-1 { background: var(--error); }
    .pw-bar.l-2 { background: #d7a86e; }
    .pw-bar.l-3 { background: #d7a86e; }
    .pw-bar.l-4 { background: var(--success); }

    /* Terms checkbox */
    .terms { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 4px 0; font-size: 13px; line-height: 1.5; color: var(--text); margin: 16px 0 22px; }
    .terms input { position: absolute; opacity: 0; pointer-events: none; }
    .terms .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); background: #fff;
      display: grid; place-items: center; flex-shrink: 0; margin-top: 2px;
      transition: background .15s, border-color .15s; }
    .terms:hover .box { border-color: var(--primary); }
    .terms input:checked ~ .box { background: var(--primary); border-color: var(--primary); }
    .terms input:checked ~ .box svg { opacity: 1; }
    .terms .box svg { opacity: 0; transition: opacity .15s; }
    .terms a { color: var(--primary); text-decoration: underline; text-decoration-color: rgba(15,42,42,.3); text-underline-offset: 2px; }
    .terms a:hover { text-decoration-color: var(--primary); }
    .terms.err .box { border-color: var(--error); }

    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="register.jsx"></script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favorilerim — bakoda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="base.css" />

  <style>
    .head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .head-row h1 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
    .head-row h1 b { color: var(--accent); font-style: italic; font-weight: 500; }
    .head-row p  { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

    .demo-bar {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 8px 6px 14px; background: #fff; border: 1px solid var(--line);
      border-radius: var(--r-pill); font-size: 12px; color: var(--muted);
      font-family: var(--mono); letter-spacing: .04em; margin-bottom: 16px;
    }
    .demo-bar button { padding: 4px 10px; border-radius: 999px; border: 0; background: var(--primary-10); color: var(--primary); cursor: pointer; font: inherit; }
    .demo-bar button:hover { background: var(--primary); color: #fff; }

    /* ── Favorites grid ── */
    .fav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    @media (max-width: 1020px) { .fav-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 540px)  { .fav-grid { grid-template-columns: 1fr; } }

    .fav-card {
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-card);
      overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), opacity .4s var(--ease);
      animation: fadeIn .4s ease-out both;
    }
    .fav-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card-hover); }
    .fav-card.removing { opacity: 0; transform: translateY(-4px) scale(.96); pointer-events: none; }

    .fav-img { position: relative; aspect-ratio: 4/3; overflow: hidden; }
    .fav-img .ph { position: absolute; inset: 0; }
    .fav-img .ph::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 1px, transparent 1px 12px); }
    .fav-img .ph::after { content: ""; position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .45; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.3) 100%); }
    .fav-img .ph-label { position: absolute; left: 12px; bottom: 10px; font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,.65); letter-spacing: .06em; }

    .heart-btn {
      position: absolute; top: 12px; right: 12px; width: 38px; height: 38px;
      border-radius: 999px; background: rgba(255,255,255,.92); border: 0; cursor: pointer;
      display: grid; place-items: center; color: var(--error);
      box-shadow: 0 4px 12px rgba(15,42,42,.18);
      transition: transform .2s var(--ease), background .15s;
    }
    .heart-btn:hover { background: #fff; transform: scale(1.06); }
    .heart-btn:active { transform: scale(.94); }
    .heart-btn svg { transition: transform .2s var(--ease); }
    .heart-btn.pop svg { animation: heartPop .4s var(--ease); }
    @keyframes heartPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    .fav-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .fav-rating { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
    .fav-rating .stars { color: var(--accent); display: inline-flex; gap: 1px; }
    .fav-rating b { font-weight: 600; }
    .fav-rating .reviews { color: var(--muted); }
    .fav-name { font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--primary); line-height: 1.2; letter-spacing: -.005em; }
    .fav-loc { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
    .fav-foot {
      display: flex; align-items: end; justify-content: space-between; gap: 10px;
      margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line);
    }
    .fav-price b { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--primary); letter-spacing: -.01em; white-space: nowrap; display: block; }
    .fav-price .per { font-size: 11px; color: var(--muted); }
    .fav-foot .btn { height: 36px; padding: 0 14px; font-size: 13px; }

    /* Placeholder colors */
    .ph-f1 { background: #4f7a73; } .ph-f2 { background: #8b6a48; }
    .ph-f3 { background: #4a6b82; } .ph-f4 { background: #8a7b59; }
    .ph-f5 { background: #6a657e; } .ph-f6 { background: #9b6a52; }
    .ph-f7 { background: #5d8678; } .ph-f8 { background: #6f4a3a; }

    /* Empty state */
    .empty {
      padding: 100px 40px; text-align: center;
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-card);
    }
    .empty .ico-big {
      width: 110px; height: 110px; margin: 0 auto 22px;
      border-radius: 999px; background: var(--primary-10); color: var(--error);
      display: grid; place-items: center; position: relative;
    }
    .empty .ico-big::before, .empty .ico-big::after {
      content: ""; position: absolute; inset: -10px; border-radius: 999px;
      border: 1.5px solid rgba(231,76,60,.18); opacity: 0;
      animation: emptyPulse 2.6s ease-out infinite;
    }
    .empty .ico-big::after { animation-delay: 1.3s; }
    @keyframes emptyPulse {
      0%   { transform: scale(.85); opacity: .5; }
      80%  { transform: scale(1.3); opacity: 0; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .empty h2 { font-size: 24px; font-weight: 600; color: var(--primary); margin-bottom: 8px; }
    .empty p  { color: var(--muted); margin: 0 auto 28px; max-width: 44ch; font-size: 14.5px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="profile-shell.jsx"></script>
  <script type="text/babel" src="favorites.jsx"></script>
</body>
</html>

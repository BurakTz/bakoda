<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rezervasyon Detayı — bakoda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="base.css" />

  <style>
    .profile-layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; padding: 32px 0 80px; }
    @media (max-width: 880px) { .profile-layout { grid-template-columns: 1fr; } }
    .profile-sidebar { position: sticky; top: 96px; align-self: start; background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
    @media (max-width: 880px) { .profile-sidebar { position: static; } }
    .sb-user { padding: 28px 22px 22px; text-align: center; border-bottom: 1px solid var(--line); }
    .sb-avatar { width: 80px; height: 80px; border-radius: 999px; margin: 0 auto 14px; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 700; font-size: 28px; }
    .sb-avatar.tone-1 { background: linear-gradient(135deg, #d7a86e 0%, #a07c4f 100%); }
    .sb-avatar.tone-2 { background: linear-gradient(135deg, #2c5f5a 0%, #163838 100%); }
    .sb-avatar.tone-3 { background: linear-gradient(135deg, #b76b4e 0%, #6f3b3b 100%); }
    .sb-name { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--primary); line-height: 1.2; }
    .sb-email { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }
    .sb-since { margin-top: 10px; padding: 4px 10px; display: inline-block; background: var(--primary-10); border-radius: var(--r-pill); font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
    .sb-nav { padding: 10px; display: flex; flex-direction: column; gap: 2px; }
    .sb-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; color: var(--text); transition: background .12s, color .12s; cursor: pointer; }
    .sb-link:hover { background: var(--bg); color: var(--primary); }
    .sb-link.active { background: var(--primary); color: #fff; font-weight: 500; }
    .sb-link.active svg { color: var(--accent); }
    .sb-logout { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); }
    .sb-logout:hover { background: rgba(231,76,60,.06); color: var(--error); }

    .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .head-row h1 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
    .head-row p  { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .back-link:hover { color: var(--primary); }

    .detail-card {
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-card);
      overflow: hidden; box-shadow: var(--shadow-card);
    }
    .detail-hero {
      display: grid; grid-template-columns: 280px 1fr; gap: 0;
      border-bottom: 1px solid var(--line);
    }
    @media (max-width: 720px) { .detail-hero { grid-template-columns: 1fr; } }
    .detail-img { min-height: 200px; background: var(--primary-10); position: relative; }
    .detail-img img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 200px; }
    .detail-img .ph { position: absolute; inset: 0; }
    .detail-head { padding: 28px 32px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  @media (max-width: 720px) { .detail-head { padding: 22px 20px; } }
    .detail-hotel { font-family: var(--display); font-size: 26px; font-weight: 600; color: var(--primary); line-height: 1.15; }
    .detail-loc { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .detail-code {
      font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--muted);
      margin-top: 4px;
    }
    .detail-status {
      display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
      padding: 6px 14px; border-radius: var(--r-pill);
      font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    }
    .detail-status.ok { background: rgba(46,204,113,.14); color: var(--success-dk); }
    .detail-status.ok .dot { background: var(--success); }
    .detail-status.past { background: rgba(138,155,176,.18); color: var(--muted); }
    .detail-status.past .dot { background: var(--muted); }
    .detail-status.canceled { background: rgba(231,76,60,.14); color: var(--error); }
    .detail-status.canceled .dot { background: var(--error); }
    .detail-status .dot { width: 5px; height: 5px; border-radius: 999px; }

    .detail-body { padding: 28px 32px; display: flex; flex-direction: column; gap: 24px; }
    @media (max-width: 720px) { .detail-body { padding: 22px 20px; } }

    .detail-dates {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center;
      padding: 20px; background: var(--bg); border-radius: 12px; border: 1px solid var(--line);
    }
    .date-col .lbl { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .date-col .val { font-family: var(--display); font-size: 20px; font-weight: 600; color: var(--primary); }
    .date-col .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .date-arrow { color: var(--accent); display: grid; place-items: center; }

    .detail-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    }
    @media (max-width: 640px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-grid .item {
      padding: 16px; border: 1px solid var(--line); border-radius: 10px;
    }
    .detail-grid .lbl { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .detail-grid .val { font-weight: 600; color: var(--primary); margin-top: 4px; font-size: 15px; }
    .detail-grid .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .detail-total {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
      padding-top: 20px; border-top: 1px solid var(--line);
    }
    .detail-total .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .detail-total .price { font-family: var(--display); font-size: 32px; font-weight: 700; color: var(--primary); letter-spacing: -.02em; }

    .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .detail-actions .btn { height: 40px; font-size: 13px; }

    .empty {
      padding: 80px 40px; text-align: center;
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-card);
    }
    .empty h2 { font-size: 22px; font-weight: 600; color: var(--primary); margin-bottom: 6px; }
    .empty p  { color: var(--muted); margin: 0 auto 22px; max-width: 48ch; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="profile-shell.jsx"></script>
  <script type="text/babel" src="booking-detail.jsx"></script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rezervasyon Onaylandı — bakoda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #0F2A2A;
      --primary-90: #1a3838;
      --primary-10: #e4ebeb;
      --accent: #D7A86E;
      --accent-dark: #b88a52;
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #2C3E50;
      --muted: #8A9BB0;
      --line: #ECEAE3;
      --success: #2ECC71;
      --success-dk: #27a35e;
      --error: #E74C3C;

      --display: "Fraunces", "Playfair Display", Georgia, serif;
      --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

      --r-btn: 8px;
      --r-card: 16px;
      --r-pill: 999px;

      --shadow-card: 0 1px 2px rgba(15,42,42,0.04), 0 12px 36px rgba(15,42,42,0.10);
      --shadow-confetti: 0 30px 60px -20px rgba(15,42,42,0.20);
      --shadow-header: 0 2px 16px rgba(0,0,0,0.06);

      --ease: cubic-bezier(.4,.0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    h1, h2, h3, h4 { font-family: var(--display); margin: 0; color: var(--primary); letter-spacing: -0.01em; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 20px; border-radius: var(--r-btn); border: 0; font-weight: 500; font-size: 14px; cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), color .2s var(--ease); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-90); }
    .btn-secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-secondary:hover { background: var(--primary); color: #fff; }
    .btn-cta { background: var(--accent); color: #fff; font-weight: 600; }
    .btn-cta:hover { background: var(--accent-dark); box-shadow: 0 8px 22px rgba(215,168,110,.35); }
    .btn-ghost { background: transparent; color: var(--text); }
    .btn-ghost:hover { background: rgba(15,42,42,.06); }

    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 32px; }
    @media (max-width: 720px) { .container { padding: 0 20px; } }

    /* ── Navbar (matches site) ── */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: var(--shadow-header); }
    .nav-inner { display: flex; align-items: center; gap: 32px; height: 72px; }
    .nav-logo { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: -.01em; line-height: 1; }
    .nav-logo .dot { color: var(--accent); }
    .nav-links { display: flex; gap: 36px; flex: 1; justify-content: center; }
    .nav-link { font-size: 14px; font-weight: 500; color: var(--text); position: relative; padding: 4px 0; transition: color .15s; }
    .nav-link::after { content: ""; position: absolute; left: 50%; right: 50%; bottom: -2px; height: 1px; background: var(--accent); transition: left .2s var(--ease), right .2s var(--ease); }
    .nav-link:hover { color: var(--primary); }
    .nav-link:hover::after, .nav-link.active::after { left: 0; right: 0; }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-lang { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
      font-size: 13px; font-weight: 500; color: var(--text); background: transparent; border: 0; border-radius: 8px; cursor: pointer; transition: background .15s var(--ease); }
    .nav-lang:hover { background: rgba(15,42,42,.06); }
    .nav-btn-ghost { background: transparent; color: var(--text); }
    .nav-btn-ghost:hover { background: rgba(15,42,42,.06); }
    @media (max-width: 880px) {
      .nav-links { display: none; }
      .nav-lang span.full { display: none; }
    }

    /* ── Page ── */
    .page { padding-top: 96px; padding-bottom: 96px; min-height: 100vh;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(215,168,110,.10) 0%, transparent 60%),
        radial-gradient(ellipse 80% 40% at 50% 8%, rgba(46,204,113,.06) 0%, transparent 70%),
        var(--bg);
    }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 32px; }
    @media (max-width: 720px) { .wrap { padding: 0 20px; } }

    /* ── Success hero ── */
    .hero { text-align: center; margin-bottom: 36px; }

    /* Animated checkmark */
    .check-ring {
      width: 96px; height: 96px; border-radius: 999px;
      background: radial-gradient(circle, rgba(46,204,113,.18) 0%, rgba(46,204,113,0) 70%);
      display: grid; place-items: center; margin: 0 auto 24px;
      position: relative;
    }
    .check-ring::before, .check-ring::after { /* pulse rings */
      content: ""; position: absolute; inset: 8px; border-radius: 999px;
      border: 1.5px solid var(--success); opacity: 0; transform: scale(.7);
      animation: pulse 2.4s ease-out infinite;
    }
    .check-ring::after { animation-delay: 1.2s; }
    @keyframes pulse {
      0%   { opacity: .55; transform: scale(.85); }
      60%  { opacity: 0;   transform: scale(1.4); }
      100% { opacity: 0;   transform: scale(1.4); }
    }
    .check-svg {
      width: 76px; height: 76px;
      filter: drop-shadow(0 8px 24px rgba(46,204,113,.30));
    }
    .check-svg .circle {
      fill: var(--success);
      animation: pop .55s var(--ease) both;
      transform-origin: center;
    }
    .check-svg .tick {
      fill: none; stroke: #fff; stroke-width: 6;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 50; stroke-dashoffset: 50;
      animation: draw .45s .35s var(--ease) forwards;
    }
    @keyframes pop {
      0%   { transform: scale(0);    opacity: 0; }
      60%  { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1);    opacity: 1; }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .hero h1 {
      font-family: var(--display); font-size: 42px; font-weight: 600;
      line-height: 1.1; letter-spacing: -.02em;
      animation: rise .6s .25s var(--ease) both;
    }
    .hero .email-line {
      margin-top: 12px; color: var(--text); font-size: 15px;
      animation: rise .6s .4s var(--ease) both;
    }
    .hero .email-line b { color: var(--primary); font-weight: 600; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Reservation card ── */
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-card);
      box-shadow: var(--shadow-card); overflow: hidden;
      animation: rise .6s .55s var(--ease) both;
    }
    .card-head {
      display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center;
      padding: 22px 28px; border-bottom: 1px dashed var(--line);
      background: linear-gradient(180deg, #fff 0%, #fafaf6 100%);
      position: relative;
    }
    /* perforated edge effect on the dashed border */
    .card-head::before, .card-head::after {
      content: ""; position: absolute; bottom: -8px; width: 16px; height: 16px;
      background: var(--bg); border-radius: 50%;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .card-head::before { left: -8px; }
    .card-head::after  { right: -8px; }

    .head-left .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .head-left .code {
      font-family: var(--mono); font-size: 18px; font-weight: 600;
      color: var(--primary); letter-spacing: .04em; margin-top: 2px;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .copy-btn {
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; color: var(--muted); cursor: pointer; display: grid; place-items: center;
      transition: border-color .15s, color .15s, background .15s;
    }
    .copy-btn:hover { border-color: var(--primary); color: var(--primary); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }
    .head-left .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      border-radius: var(--r-pill); background: rgba(46,204,113,.12); color: var(--success-dk);
      font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; margin-top: 12px;
    }
    .head-left .badge .dot {
      width: 6px; height: 6px; border-radius: 999px; background: var(--success);
      box-shadow: 0 0 0 3px rgba(46,204,113,.25);
    }

    /* QR placeholder — iconographic finder squares + data dots */
    .qr {
      width: 88px; height: 88px; padding: 6px; background: #fff;
      border: 1px solid var(--line); border-radius: 10px;
      display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr); gap: 1px;
    }
    .qr i { background: var(--primary); border-radius: 1px; }
    .qr i.off { background: transparent; }
    .qr .finder { background: var(--primary); }
    .qr-caption { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: var(--muted); text-align: center; margin-top: 4px; text-transform: uppercase; }

    .card-body { padding: 28px; }
    .hotel-row {
      display: flex; align-items: center; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid var(--line);
    }
    .hotel-thumb {
      width: 56px; height: 56px; border-radius: 10px; position: relative; overflow: hidden; flex-shrink: 0;
      background: #4f7a73;
    }
    .hotel-thumb::before {
      content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 1px, transparent 1px 10px);
    }
    .hotel-thumb::after {
      content: ""; position: absolute; inset: 0; mix-blend-mode: multiply;
      background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.3) 100%);
    }
    .hotel-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .hotel-name { font-family: var(--display); font-size: 20px; font-weight: 600; color: var(--primary); line-height: 1.15; letter-spacing: -.005em; }
    .hotel-loc { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }

    .dates {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px;
      padding: 20px 0; border-bottom: 1px solid var(--line);
    }
    @media (max-width: 560px) { .dates { grid-template-columns: 1fr; gap: 14px; } }
    .date-block .lbl {
      font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .date-block .lbl svg { color: var(--accent); }
    .date-block .day { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--primary); line-height: 1; letter-spacing: -.01em; margin-top: 6px; }
    .date-block .day small { font-family: var(--body); font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; letter-spacing: 0; }
    .date-block .time { font-size: 12px; color: var(--text); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .date-arrow { width: 36px; height: 36px; border-radius: 999px; background: var(--primary-10); display: grid; place-items: center; color: var(--primary); margin-top: 18px; }
    @media (max-width: 560px) { .date-arrow { display: none; } }

    .meta-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      padding: 20px 0; border-bottom: 1px solid var(--line);
    }
    @media (max-width: 560px) { .meta-grid { grid-template-columns: 1fr 1fr; } }
    .meta-item .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .meta-item .val { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--primary); margin-top: 4px; }
    .meta-item .sub { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; letter-spacing: .04em; }

    .total-row {
      display: flex; justify-content: space-between; align-items: center; padding-top: 22px;
      gap: 16px; flex-wrap: wrap;
    }
    .total-row .lhs .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .total-row .lhs .pay { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); margin-top: 6px; }
    .total-row .lhs .pay .card-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border: 1px solid var(--line); border-radius: var(--r-pill); font-family: var(--mono); font-size: 11px; color: var(--text);
    }
    .total-row .rhs { text-align: right; }
    .total-row .rhs .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .total-row .rhs .val {
      font-family: var(--display); font-size: 32px; font-weight: 700;
      color: var(--primary); letter-spacing: -.01em; line-height: 1; margin-top: 4px;
      white-space: nowrap;
    }
    .total-row .rhs .ok-pill {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
      padding: 3px 10px; background: rgba(46,204,113,.12); color: var(--success-dk);
      border-radius: var(--r-pill); font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    }

    /* ── Actions ── */
    .actions {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      margin-top: 24px;
      animation: rise .6s .7s var(--ease) both;
    }
    @media (max-width: 560px) { .actions { grid-template-columns: 1fr; } }
    .actions .btn { width: 100%; height: 50px; font-size: 14px; }

    /* ── Note ── */
    .note {
      margin-top: 28px; padding: 18px 22px;
      background: rgba(215,168,110,.10); border: 1px solid rgba(215,168,110,.30);
      border-radius: 12px; display: flex; gap: 14px; align-items: flex-start;
      animation: rise .6s .85s var(--ease) both;
    }
    .note .ico {
      width: 36px; height: 36px; border-radius: 999px; background: var(--accent); color: #fff;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .note h3 { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--primary); margin-bottom: 2px; }
    .note p { font-size: 13px; color: var(--text); line-height: 1.55; margin: 0; }

    .next-step {
      margin-top: 36px; text-align: center;
      animation: rise .6s 1s var(--ease) both;
    }
    .next-step a {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--primary); font-weight: 500;
      padding: 10px 20px; border-radius: var(--r-pill);
      transition: gap .2s var(--ease), color .15s;
    }
    .next-step a:hover { color: var(--accent-dark); gap: 14px; }
    .next-step a svg { transition: transform .2s var(--ease); }
    .next-step a:hover svg { transform: translateX(4px); }

    /* Confetti dots */
    .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti i {
      position: absolute; width: 6px; height: 6px; border-radius: 1px;
      opacity: 0; animation: fall 2.6s ease-out forwards;
    }
    @keyframes fall {
      0%   { opacity: 0; transform: translateY(-40px) rotate(0); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(280px) rotate(540deg); }
    }

    /* Toast */
    .toast { position: fixed; top: 88px; left: 50%; transform: translateX(-50%) translateY(-12px); opacity: 0;
      background: var(--primary); color: #fff; padding: 12px 20px; border-radius: var(--r-pill);
      box-shadow: 0 12px 32px rgba(15,42,42,.4); z-index: 200; font-size: 14px;
      transition: opacity .25s var(--ease), transform .25s var(--ease); pointer-events: none;
      display: inline-flex; align-items: center; gap: 10px; }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .ok { width: 18px; height: 18px; border-radius: 999px; background: var(--success); color: #fff; display: grid; place-items: center; font-size: 11px; }

    /* Footer */
    footer { background: var(--primary); color: rgba(255,255,255,.75); padding: 80px 0 28px; }
    footer h4 { color: #fff; font-family: var(--display); font-size: 16px; font-weight: 600; margin: 0 0 18px; letter-spacing: .01em; }
    .foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 56px; }
    @media (max-width: 980px) { .foot-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .foot-grid { grid-template-columns: 1fr; } }
    .foot-grid ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 11px; font-size: 14px; }
    .foot-grid ul a:hover { color: var(--accent); }
    .foot-brand { font-family: var(--display); font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
    .foot-brand .dot { color: var(--accent); }
    .foot-tag { color: rgba(255,255,255,.65); margin: 12px 0 20px; font-size: 14px; max-width: 32ch; }
    .foot-social { display: flex; gap: 10px; }
    .foot-social a { width: 38px; height: 38px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
      display: grid; place-items: center; transition: background .15s, border-color .15s, color .15s; color: rgba(255,255,255,.8); }
    .foot-social a:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .foot-bar { border-top: 1px solid rgba(255,255,255,.10); padding-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; color: rgba(255,255,255,.55); font-size: 13px; }
    .foot-bar .links { display: flex; gap: 24px; }
    .foot-bar a:hover { color: #fff; }

    button:focus-visible, input:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="confirmation.jsx"></script>
</body>
</html>

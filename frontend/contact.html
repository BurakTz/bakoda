<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İletişim — bakoda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="base.css" />

  <style>
    /* ── Top hero ── */
    .contact-hero {
      padding: 80px 0 56px; text-align: center; background: #fff; border-bottom: 1px solid var(--line);
    }
    .contact-hero .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
    }
    .contact-hero .eyebrow::before, .contact-hero .eyebrow::after {
      content: ""; width: 24px; height: 1px; background: var(--accent); display: inline-block;
    }
    .contact-hero h1 {
      font-family: var(--display); font-size: clamp(36px, 5vw, 52px); font-weight: 500;
      line-height: 1.1; letter-spacing: -.02em;
    }
    .contact-hero p { color: var(--muted); font-size: 17px; margin: 14px auto 0; max-width: 52ch; }

    /* ── 3 contact channel cards ── */
    .channels {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      margin: -32px auto 0; max-width: 1080px; padding: 0 32px; position: relative; z-index: 2;
    }
    @media (max-width: 880px) { .channels { grid-template-columns: 1fr; padding: 0 20px; } }
    .channel {
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); padding: 22px;
      display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: center;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s;
      cursor: pointer;
    }
    .channel:hover { transform: translateY(-3px); box-shadow: var(--shadow-card-hover); border-color: transparent; }
    .channel .ico { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
      background: var(--primary-10); color: var(--primary); }
    .channel.live .ico { background: rgba(46,204,113,.12); color: var(--success-dk); }
    .channel.live .ico { position: relative; }
    .channel.live .ico::after {
      content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 999px;
      background: var(--success); box-shadow: 0 0 0 3px rgba(46,204,113,.25);
    }
    .channel h3 { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--primary); }
    .channel .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .channel .arr { color: var(--muted); transition: transform .2s var(--ease), color .15s; }
    .channel:hover .arr { color: var(--primary); transform: translateX(4px); }

    /* ── Main grid: form + info ── */
    .contact-grid {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; padding: 64px 0;
    }
    @media (max-width: 980px) { .contact-grid { grid-template-columns: 1fr; gap: 28px; } }

    .form-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); padding: 32px 36px; }
    @media (max-width: 720px) { .form-card { padding: 24px 22px; } }
    .form-card h2 { font-size: 22px; font-weight: 600; letter-spacing: -.005em; }
    .form-card p  { color: var(--muted); font-size: 14px; margin: 4px 0 22px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field + .field { margin-top: 14px; }
    .field label { font-size: 13px; font-weight: 500; color: var(--text); }
    .field label .req { color: var(--error); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .field-grid > .field + .field { margin-top: 0; }
    @media (max-width: 540px) { .field-grid { grid-template-columns: 1fr; } .field-grid > .field + .field { margin-top: 14px; } }
    .err-msg { font-size: 12px; color: var(--error); display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; }
    .input.err, .textarea.err, .select.err { border-color: var(--error); }

    /* Info column */
    .info-card {
      background: var(--primary); color: #fff; border-radius: var(--r-card); padding: 32px;
      position: relative; overflow: hidden;
    }
    .info-card::before {
      content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 1px, transparent 1px 16px);
      pointer-events: none;
    }
    .info-card > * { position: relative; }
    .info-card h3 {
      font-family: var(--display); font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 6px;
    }
    .info-card .lead { color: rgba(255,255,255,.72); font-size: 14px; margin: 0 0 24px; }

    .info-rows { display: flex; flex-direction: column; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid rgba(255,255,255,.12); }
    .info-row { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; font-size: 14px; line-height: 1.5; }
    .info-row .ico { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.10); color: var(--accent);
      display: grid; place-items: center; flex-shrink: 0; }
    .info-row .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.6); }
    .info-row .val { color: #fff; font-weight: 500; margin-top: 1px; }
    .info-row .sub { color: rgba(255,255,255,.65); font-size: 12px; margin-top: 2px; }
    .info-row a { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.3); text-underline-offset: 2px; }
    .info-row a:hover { text-decoration-color: var(--accent); }

    .info-quick { padding-top: 22px; }
    .info-quick h4 { color: #fff; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
    .info-quick ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .info-quick ul a { color: rgba(255,255,255,.85); display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; transition: color .15s, gap .15s var(--ease); }
    .info-quick ul a:hover { color: var(--accent); gap: 12px; }

    .info-social { display: flex; gap: 8px; margin-top: 20px; }
    .info-social a {
      width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
      display: grid; place-items: center; color: rgba(255,255,255,.85);
      transition: background .15s, border-color .15s, color .15s;
    }
    .info-social a:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── FAQ ── */
    .faq { background: var(--bg); border-top: 1px solid var(--line); padding: 80px 0 96px; }
    .faq-head { text-align: center; margin-bottom: 40px; }
    .faq-head .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    }
    .faq-head .eyebrow::before, .faq-head .eyebrow::after {
      content: ""; width: 20px; height: 1px; background: var(--accent); display: inline-block;
    }
    .faq-head h2 { font-size: 32px; font-weight: 600; letter-spacing: -.01em; }

    .faq-list { max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
    .faq-item { border-top: 1px solid var(--line); }
    .faq-item:first-child { border-top: 0; }
    .faq-q {
      width: 100%; text-align: left; padding: 22px 26px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: transparent; border: 0; font: inherit; cursor: pointer;
      font-size: 16px; font-weight: 500; color: var(--primary);
      transition: background .12s, color .12s;
    }
    .faq-q:hover { background: var(--bg); }
    .faq-q .plus {
      width: 32px; height: 32px; border-radius: 999px; background: var(--primary-10); color: var(--primary);
      display: grid; place-items: center; flex-shrink: 0; transition: transform .25s var(--ease), background .15s;
    }
    .faq-item.open .faq-q .plus { transform: rotate(45deg); background: var(--accent); color: #fff; }
    .faq-a {
      max-height: 0; overflow: hidden;
      transition: max-height .35s var(--ease), padding .25s var(--ease);
    }
    .faq-a-inner { padding: 0 26px 24px; color: var(--text); font-size: 14.5px; line-height: 1.7; max-width: 68ch; }
    .faq-item.open .faq-a { max-height: 320px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="contact.jsx"></script>
</body>
</html>

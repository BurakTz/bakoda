<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bakoda — Arama Sonuçları</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ───── Design system (matches index.html) ───── */
    :root {
      --primary: #0F2A2A;
      --primary-90: #1a3838;
      --primary-10: #e4ebeb;
      --accent: #D7A86E;
      --accent-dark: #b88a52;
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #2C3E50;
      --muted: #8A9BB0;
      --line: #ECEAE3;
      --success: #2ECC71;
      --error: #E74C3C;

      --display: "Fraunces", "Playfair Display", Georgia, serif;
      --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

      --r-btn: 8px;
      --r-card: 16px;
      --r-input: 10px;
      --r-pill: 999px;

      --shadow-card: 0 1px 2px rgba(15,42,42,0.04), 0 8px 32px rgba(15,42,42,0.08);
      --shadow-card-hover: 0 12px 40px rgba(15,42,42,0.14), 0 2px 6px rgba(15,42,42,0.06);
      --shadow-header: 0 2px 16px rgba(0,0,0,0.06);

      --ease: cubic-bezier(.4,.0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3, h4 { font-family: var(--display); margin: 0; color: var(--primary); letter-spacing: -0.01em; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 20px; border-radius: var(--r-btn); border: 0;
      font-weight: 500; font-size: 14px; cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), color .2s var(--ease); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn[disabled] { opacity: .4; pointer-events: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-90); }
    .btn-secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-secondary:hover { background: var(--primary); color: #fff; }
    .btn-cta { background: var(--accent); color: #fff; font-weight: 600; }
    .btn-cta:hover { background: var(--accent-dark); box-shadow: 0 8px 22px rgba(215,168,110,.35); }
    .btn-ghost { background: transparent; color: var(--text); }
    .btn-ghost:hover { background: rgba(15,42,42,.06); }

    .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px; }
    @media (max-width: 720px) { .container { padding: 0 20px; } }

    /* ── Navbar (matches homepage) ── */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: var(--shadow-header); }
    .nav-inner { display: flex; align-items: center; gap: 32px; height: 72px; }
    .nav-logo { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: -.01em; line-height: 1; }
    .nav-logo .dot { color: var(--accent); }
    .nav-links { display: flex; gap: 36px; flex: 1; justify-content: center; }
    .nav-link { font-size: 14px; font-weight: 500; color: var(--text); position: relative; padding: 4px 0; transition: color .15s; }
    .nav-link::after { content: ""; position: absolute; left: 50%; right: 50%; bottom: -2px; height: 1px; background: var(--accent); transition: left .2s var(--ease), right .2s var(--ease); }
    .nav-link:hover { color: var(--primary); }
    .nav-link:hover::after, .nav-link.active::after { left: 0; right: 0; }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-lang { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
      font-size: 13px; font-weight: 500; color: var(--text); background: transparent; border: 0; border-radius: 8px;
      cursor: pointer; transition: background .15s var(--ease); }
    .nav-lang:hover { background: rgba(15,42,42,.06); }
    .nav-btn-ghost { background: transparent; color: var(--text); }
    .nav-btn-ghost:hover { background: rgba(15,42,42,.06); }
    @media (max-width: 880px) {
      .nav-links { display: none; }
      .nav-lang span.full { display: none; }
    }

    /* ── Page layout ── */
    .page { padding-top: 72px; min-height: 100vh; }
    .crumbs { background: #fff; border-bottom: 1px solid var(--line); }
    .crumbs-inner { display: flex; align-items: center; gap: 10px; height: 52px;
      font-size: 13px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em; }
    .crumbs-inner a:hover { color: var(--primary); }
    .crumbs-inner .sep { opacity: .5; }
    .crumbs-inner .here { color: var(--text); }

    .results-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 32px; padding: 32px 0 80px; }
    @media (max-width: 980px) { .results-wrap { grid-template-columns: 1fr; } }

    /* ── Sidebar ── */
    .sidebar { position: sticky; top: 96px; align-self: start; background: #fff;
      border: 1px solid var(--line); border-radius: var(--r-card); padding: 4px; max-height: calc(100vh - 112px); overflow: hidden; }
    .sidebar-inner { padding: 22px 22px 24px; overflow-y: auto; max-height: calc(100vh - 120px); }
    .sidebar-inner::-webkit-scrollbar { width: 6px; }
    .sidebar-inner::-webkit-scrollbar-thumb { background: rgba(15,42,42,.15); border-radius: 4px; }
    .sb-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
    .sb-head h3 { font-size: 18px; font-weight: 600; }
    .sb-head .clear { font-size: 12px; color: var(--muted); cursor: pointer; background: transparent; border: 0; padding: 4px 0; font-family: var(--mono); letter-spacing: .04em; }
    .sb-head .clear:hover { color: var(--primary); }
    .sb-sep { height: 1px; background: var(--line); margin: 18px -22px; }

    .filter-block { display: flex; flex-direction: column; gap: 10px; }
    .filter-label { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

    /* Price slider */
    .price-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
    .price-row .val { font-weight: 600; color: var(--primary); font-variant-numeric: tabular-nums; font-size: 15px; }
    .price-row .sub { font-size: 11px; color: var(--muted); font-family: var(--mono); }
    .slider-track { position: relative; height: 4px; background: var(--line); border-radius: 999px; margin: 12px 0 8px; }
    .slider-range { position: absolute; height: 100%; background: var(--primary); border-radius: 999px; }
    .slider-input { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
      width: 100%; height: 18px; appearance: none; -webkit-appearance: none; background: transparent;
      pointer-events: none; margin: 0; }
    .slider-input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto;
      width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--primary);
      box-shadow: 0 2px 4px rgba(0,0,0,.18); cursor: pointer; }
    .slider-input::-moz-range-thumb { pointer-events: auto;
      width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--primary);
      box-shadow: 0 2px 4px rgba(0,0,0,.18); cursor: pointer; }
    .slider-axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* Check option */
    .check { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; cursor: pointer; font-size: 14px; color: var(--text); }
    .check:hover .box { border-color: var(--primary); }
    .check .label { display: inline-flex; align-items: center; gap: 10px; }
    .check .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); background: #fff; display: grid; place-items: center; transition: background .15s, border-color .15s; flex-shrink: 0; }
    .check input { position: absolute; opacity: 0; pointer-events: none; }
    .check input:checked + .label .box { background: var(--primary); border-color: var(--primary); }
    .check input:checked + .label .box svg { opacity: 1; }
    .check .box svg { opacity: 0; transition: opacity .15s; }
    .check .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .check .stars { color: var(--accent); display: inline-flex; gap: 1px; }

    /* Radio chips (puan) */
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { padding: 6px 12px; border-radius: var(--r-pill); border: 1px solid var(--line); background: #fff;
      font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; color: var(--text); }
    .chip:hover { border-color: var(--primary); }
    .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }

    .sidebar .apply { width: 100%; margin-top: 18px; }

    /* ── Main / summary bar ── */
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .summary h1 { font-size: 26px; font-weight: 600; line-height: 1.2; }
    .summary h1 b { color: var(--accent); font-style: italic; font-weight: 500; }
    .summary p { color: var(--muted); margin: 4px 0 0; font-size: 13px; font-family: var(--mono); letter-spacing: .04em; }
    .summary .sort { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
    .summary .sort label { color: var(--muted); }
    .sort-select { appearance: none; height: 38px; padding: 0 36px 0 14px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A9BB0' d='M0 0h10L5 6z'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center; }
    .sort-select:hover { border-color: var(--primary); }
    .sort-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* Active filter chips row */
    .active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .active-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 12px;
      background: var(--primary-10); color: var(--primary); border-radius: var(--r-pill); font-size: 12px; font-weight: 500; }
    .active-chip button { width: 20px; height: 20px; border-radius: 999px; border: 0; background: transparent;
      cursor: pointer; color: var(--primary); display: grid; place-items: center; }
    .active-chip button:hover { background: rgba(15,42,42,.12); }

    /* ── Result card (horizontal) ── */
    .result-list { display: flex; flex-direction: column; gap: 18px; }
    .result-card { display: grid; grid-template-columns: 280px 1fr; background: #fff;
      border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; cursor: pointer;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
    .result-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card-hover); border-color: transparent; }
    @media (max-width: 720px) { .result-card { grid-template-columns: 1fr; } }

    .rc-img { position: relative; aspect-ratio: 280/200; min-height: 200px; }
    @media (max-width: 720px) { .rc-img { aspect-ratio: 16/9; min-height: 0; } }
    .rc-img .ph { position: absolute; inset: 0; }
    .rc-img .ph::before { content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 1px, transparent 1px 12px); }
    .rc-img .ph::after { content: ""; position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .5;
      background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.3) 100%); }
    .rc-img .ph-label { position: absolute; left: 12px; bottom: 10px; font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,.65); letter-spacing: .08em; }
    .rc-badge { position: absolute; top: 12px; left: 12px; padding: 5px 11px; background: var(--accent); color: #fff;
      border-radius: var(--r-pill); font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
    .rc-fav { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 999px;
      background: rgba(255,255,255,.9); border: 0; cursor: pointer; display: grid; place-items: center;
      color: var(--text); transition: background .15s, color .15s; }
    .rc-fav:hover { background: #fff; }
    .rc-fav.on { color: var(--error); }

    .rc-body { display: grid; grid-template-columns: 1fr auto; padding: 22px 24px; gap: 20px; min-width: 0; }
    @media (max-width: 720px) { .rc-body { grid-template-columns: 1fr; } }

    .rc-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .rc-rating { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
    .rc-stars { color: var(--accent); display: inline-flex; gap: 1px; }
    .rc-type { color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .rc-name { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--primary); line-height: 1.15; letter-spacing: -.005em; margin-top: 2px; }
    .rc-loc { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .rc-loc a { color: var(--primary); text-decoration: underline; text-decoration-color: rgba(15,42,42,.25); text-underline-offset: 2px; }
    .rc-loc a:hover { text-decoration-color: var(--primary); }
    .rc-amen { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 6px; }
    .rc-amen span { display: inline-flex; align-items: center; gap: 5px; }
    .rc-perks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .rc-perk { font-size: 11px; padding: 3px 9px; border-radius: var(--r-pill);
      background: rgba(46,204,113,.10); color: #1e8e51; font-weight: 500; }
    .rc-perk.warn { background: rgba(215,168,110,.15); color: var(--accent-dark); }

    /* Right column: score + price */
    .rc-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; min-width: 180px; }
    .rc-score { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .rc-score .meta { text-align: right; }
    .rc-score .verdict { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--primary); line-height: 1.1; }
    .rc-score .reviews { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em; }
    .rc-score .badge { width: 50px; height: 46px; border-radius: 10px 10px 10px 4px; background: var(--primary); color: #fff;
      display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
    .rc-score .badge.gold { background: var(--accent); }

    .rc-price { text-align: right; }
    .rc-price .from { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: .06em; }
    .rc-price b { font-family: var(--display); font-size: 28px; color: var(--primary); font-weight: 700; letter-spacing: -.01em; display: block; white-space: nowrap; }
    .rc-price .per { font-size: 12px; color: var(--muted); }
    .rc-price .total { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
    .rc-price .btn { height: 40px; padding: 0 18px; font-size: 13px; margin-top: 12px; }

    /* Placeholders — tonal swatches with mono labels */
    .ph-r1 { background: #4f7a73; }
    .ph-r2 { background: #8b6a48; }
    .ph-r3 { background: #4a6b82; }
    .ph-r4 { background: #8a7b59; }
    .ph-r5 { background: #6a657e; }
    .ph-r6 { background: #9b6a52; }
    .ph-r7 { background: #5d8678; }
    .ph-r8 { background: #6f4a3a; }

    /* Pagination */
    .pag { display: flex; gap: 6px; justify-content: center; margin-top: 36px; }
    .pag button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
      font: inherit; font-size: 13px; color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; }
    .pag button:hover { border-color: var(--primary); }
    .pag button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pag button.arrow { color: var(--muted); }
    .pag button[disabled] { opacity: .35; cursor: not-allowed; }

    /* ── Footer (matches homepage) ── */
    footer { background: var(--primary); color: rgba(255,255,255,.75); padding: 80px 0 28px; }
    footer h4 { color: #fff; font-family: var(--display); font-size: 16px; font-weight: 600; margin: 0 0 18px; letter-spacing: .01em; }
    .foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 56px; }
    @media (max-width: 980px) { .foot-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .foot-grid { grid-template-columns: 1fr; } }
    .foot-grid ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 11px; font-size: 14px; }
    .foot-grid ul a:hover { color: var(--accent); }
    .foot-brand { font-family: var(--display); font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
    .foot-brand .dot { color: var(--accent); }
    .foot-tag { color: rgba(255,255,255,.65); margin: 12px 0 20px; font-size: 14px; max-width: 32ch; }
    .foot-social { display: flex; gap: 10px; }
    .foot-social a { width: 38px; height: 38px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
      display: grid; place-items: center; transition: background .15s, border-color .15s, color .15s; color: rgba(255,255,255,.8); }
    .foot-social a:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .foot-bar { border-top: 1px solid rgba(255,255,255,.10); padding-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; color: rgba(255,255,255,.55); font-size: 13px; }
    .foot-bar .links { display: flex; gap: 24px; }
    .foot-bar a:hover { color: #fff; }

    /* Toast */
    .toast { position: fixed; top: 88px; left: 50%; transform: translateX(-50%) translateY(-12px); opacity: 0;
      background: var(--primary); color: #fff; padding: 12px 20px; border-radius: var(--r-pill);
      box-shadow: 0 12px 32px rgba(15,42,42,.4); z-index: 200; font-size: 14px;
      transition: opacity .25s var(--ease), transform .25s var(--ease); pointer-events: none;
      display: inline-flex; align-items: center; gap: 10px; }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .ok { width: 18px; height: 18px; border-radius: 999px; background: var(--success); color: #fff; display: grid; place-items: center; font-size: 11px; }

    .fade-in { animation: fadeIn .35s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    button:focus-visible, input:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="search-results.jsx"></script>
</body>
</html>

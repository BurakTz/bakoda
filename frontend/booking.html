<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rezervasyon — bakoda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ───── Design system (matches bakoda pages) ───── */
    :root {
      --primary: #0F2A2A;
      --primary-90: #1a3838;
      --primary-10: #e4ebeb;
      --accent: #D7A86E;
      --accent-dark: #b88a52;
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #2C3E50;
      --muted: #8A9BB0;
      --line: #ECEAE3;
      --success: #2ECC71;
      --error: #E74C3C;

      --display: "Fraunces", "Playfair Display", Georgia, serif;
      --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

      --r-btn: 8px;
      --r-card: 16px;
      --r-input: 10px;
      --r-pill: 999px;

      --shadow-card: 0 1px 2px rgba(15,42,42,0.04), 0 8px 32px rgba(15,42,42,0.08);
      --shadow-summary: 0 24px 48px -16px rgba(15,42,42,0.18), 0 8px 24px rgba(15,42,42,0.08);
      --shadow-header: 0 2px 16px rgba(0,0,0,0.06);

      --ease: cubic-bezier(.4,.0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    h1, h2, h3, h4 { font-family: var(--display); margin: 0; color: var(--primary); letter-spacing: -0.01em; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    ::selection { background: var(--accent); color: #fff; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 20px; border-radius: var(--r-btn); border: 0; font-weight: 500; font-size: 14px; cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), color .2s var(--ease); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn[disabled] { opacity: .4; pointer-events: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-90); }
    .btn-secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-secondary:hover { background: var(--primary); color: #fff; }
    .btn-cta { background: var(--accent); color: #fff; font-weight: 600; }
    .btn-cta:hover { background: var(--accent-dark); box-shadow: 0 8px 22px rgba(215,168,110,.35); }
    .btn-ghost { background: transparent; color: var(--text); }
    .btn-ghost:hover { background: rgba(15,42,42,.06); }

    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 32px; }
    @media (max-width: 720px) { .container { padding: 0 20px; } }

    /* ── Navbar (matches site) ── */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: var(--shadow-header); }
    .nav-inner { display: flex; align-items: center; gap: 32px; height: 72px; }
    .nav-logo { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: -.01em; line-height: 1; }
    .nav-logo .dot { color: var(--accent); }
    .nav-links { display: flex; gap: 36px; flex: 1; justify-content: center; }
    .nav-link { font-size: 14px; font-weight: 500; color: var(--text); position: relative; padding: 4px 0; transition: color .15s; }
    .nav-link::after { content: ""; position: absolute; left: 50%; right: 50%; bottom: -2px; height: 1px; background: var(--accent); transition: left .2s var(--ease), right .2s var(--ease); }
    .nav-link:hover { color: var(--primary); }
    .nav-link:hover::after, .nav-link.active::after { left: 0; right: 0; }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-lang { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
      font-size: 13px; font-weight: 500; color: var(--text); background: transparent; border: 0; border-radius: 8px; cursor: pointer; transition: background .15s var(--ease); }
    .nav-lang:hover { background: rgba(15,42,42,.06); }
    .nav-btn-ghost { background: transparent; color: var(--text); }
    .nav-btn-ghost:hover { background: rgba(15,42,42,.06); }
    @media (max-width: 880px) {
      .nav-links { display: none; }
      .nav-lang span.full { display: none; }
    }

    /* ── Page ── */
    .page { padding-top: 72px; min-height: 100vh; padding-bottom: 80px; }
    .crumbs { background: #fff; border-bottom: 1px solid var(--line); }
    .crumbs-inner { display: flex; align-items: center; gap: 10px; height: 52px;
      font-size: 13px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em; }
    .crumbs-inner a:hover { color: var(--primary); }
    .crumbs-inner .sep { opacity: .5; }
    .crumbs-inner .here { color: var(--text); }

    /* ── Stepper ── */
    .stepper-wrap { background: #fff; border-bottom: 1px solid var(--line); padding: 32px 0; }
    .stepper { display: flex; align-items: center; gap: 0; max-width: 720px; margin: 0 auto; }
    .stepper .step { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
    .stepper .step .num {
      width: 36px; height: 36px; border-radius: 999px;
      background: #fff; border: 1.5px solid var(--line); color: var(--muted);
      display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 15px;
      transition: background .2s, border-color .2s, color .2s; flex-shrink: 0;
    }
    .stepper .step.active .num { background: var(--primary); border-color: var(--primary); color: #fff; }
    .stepper .step.done .num    { background: var(--accent); border-color: var(--accent); color: #fff; }
    .stepper .step .txt { display: flex; flex-direction: column; min-width: 0; }
    .stepper .step .txt .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .stepper .step .txt .ttl { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
    .stepper .step.active .txt .ttl, .stepper .step.done .txt .ttl { color: var(--text); }
    .stepper .step.active .txt .ttl { color: var(--primary); font-weight: 600; }
    .stepper .line { flex: 0 1 60px; height: 1.5px; background: var(--line); margin: 0 14px; }
    .stepper .line.done { background: var(--accent); }
    @media (max-width: 640px) {
      .stepper .txt { display: none; }
      .stepper .line { flex: 1; }
    }

    /* ── Two-column ── */
    .book-layout { display: grid; grid-template-columns: 1fr 380px; gap: 40px; padding: 40px 0 0; align-items: start; }
    @media (max-width: 980px) { .book-layout { grid-template-columns: 1fr; } }

    .form-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); padding: 32px 36px; }
    @media (max-width: 720px) { .form-card { padding: 24px 22px; } }
    .form-card h1 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 4px; }
    .form-card .lead { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

    .section-divider { height: 1px; background: var(--line); margin: 28px 0; }
    .form-section-title { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .form-section-title::before { content: ""; width: 20px; height: 1px; background: var(--accent); }

    /* Fields */
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    @media (max-width: 540px) { .field-grid { grid-template-columns: 1fr; } }
    .field-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field-col.full { grid-column: 1 / -1; }
    .field-col label { font-size: 13px; font-weight: 500; color: var(--text); display: flex; gap: 4px; align-items: baseline; }
    .field-col label .req { color: var(--error); }
    .field-col .hint { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--muted); margin-top: 2px; }
    .input, .select, .textarea {
      width: 100%; height: 46px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: var(--r-input); background: #fff;
      font: inherit; font-size: 14px; color: var(--text); outline: none;
      transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
    }
    .textarea { height: 110px; padding: 12px 14px; resize: vertical; line-height: 1.55; font-family: inherit; }
    .input:hover, .select:hover, .textarea:hover { border-color: rgba(15,42,42,.4); }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(215,168,110,.22); }
    .input.err, .select.err, .textarea.err { border-color: var(--error); }
    .input.err:focus, .textarea.err:focus { box-shadow: 0 0 0 3px rgba(231,76,60,.16); }
    .input::placeholder, .textarea::placeholder { color: var(--muted); }
    .err-msg { font-size: 12px; color: var(--error); display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; }
    .input-affix { position: relative; }
    .input-affix .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .input-affix .input { padding-left: 42px; }
    .select { appearance: none; padding-right: 38px; cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238A9BB0' d='M0 0h10L5 6z'/></svg>");
      background-repeat: no-repeat; background-position: right 14px center; background-color: #fff; }

    /* Country chip on phone */
    .phone-wrap { display: grid; grid-template-columns: 92px 1fr; gap: 8px; }
    .phone-wrap .select { padding: 0 10px; background-position: right 10px center; }

    /* Checkboxes */
    .check-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 4px 0; font-size: 14px; line-height: 1.5; color: var(--text); }
    .check input { position: absolute; opacity: 0; pointer-events: none; }
    .check .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); background: #fff;
      display: grid; place-items: center; flex-shrink: 0; margin-top: 2px;
      transition: background .15s, border-color .15s; }
    .check:hover .box { border-color: var(--primary); }
    .check input:checked ~ .box { background: var(--primary); border-color: var(--primary); }
    .check input:checked ~ .box svg { opacity: 1; }
    .check .box svg { opacity: 0; transition: opacity .15s; }
    .check a { color: var(--primary); text-decoration: underline; text-decoration-color: rgba(15,42,42,.25); text-underline-offset: 2px; }
    .check a:hover { text-decoration-color: var(--primary); }

    /* Submit row */
    .submit-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 28px; flex-wrap: wrap; }
    .submit-row .back { color: var(--muted); font-size: 13px; }
    .submit-row .back:hover { color: var(--primary); }
    .submit-row .next { min-width: 240px; height: 50px; font-size: 15px; flex: 1 0 auto; max-width: 100%; }

    /* Trust strip */
    .trust { display: flex; gap: 24px; margin-top: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
    .trust span { display: inline-flex; align-items: center; gap: 6px; }

    /* ── Summary (right sticky) ── */
    .summary { position: sticky; top: 96px; background: #fff; border: 1px solid var(--line);
      border-radius: var(--r-card); box-shadow: var(--shadow-summary); overflow: hidden; }
    .summary-head { display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding: 18px; border-bottom: 1px solid var(--line); align-items: stretch; }
    .summary-thumb { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; }
    .summary-thumb .ph { position: absolute; inset: 0; background: #4f7a73; }
    .summary-thumb .ph::before { content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 1px, transparent 1px 12px); }
    .summary-thumb .ph::after { content: ""; position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .45;
      background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.3) 100%); }
    .summary-thumb .ph-label { position: absolute; left: 6px; bottom: 4px; font-family: var(--mono); font-size: 8px; color: rgba(255,255,255,.7); letter-spacing: .04em; }
    .summary-h { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .summary-stars { color: var(--accent); display: inline-flex; gap: 1px; }
    .summary-name { font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--primary); line-height: 1.2; letter-spacing: -.005em; }
    .summary-loc { color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }

    .summary-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .stay-rows { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .stay-row { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
    .stay-row .ico { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-10); color: var(--primary); display: grid; place-items: center; }
    .stay-row .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .stay-row .val { color: var(--text); font-weight: 500; font-size: 14px; line-height: 1.2; }
    .stay-row .change { background: transparent; border: 0; cursor: pointer; color: var(--primary); font-family: var(--mono);
      font-size: 11px; letter-spacing: .04em; padding: 6px 4px; }
    .stay-row .change:hover { text-decoration: underline; text-underline-offset: 3px; }

    .price-rows { display: flex; flex-direction: column; gap: 10px; font-size: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .price-rows .row { display: flex; justify-content: space-between; align-items: baseline; color: var(--text); }
    .price-rows .label { color: var(--muted); font-size: 13px; }
    .price-rows .row.discount { color: #1e8e51; }
    .price-rows .row.discount .label { color: #1e8e51; }

    .total-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 4px; }
    .total-row .lbl { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--primary); }
    .total-row .val { font-family: var(--display); font-weight: 700; font-size: 28px; color: var(--primary); letter-spacing: -.01em; white-space: nowrap; }
    .total-row .sub { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

    .summary-perks { padding: 16px 18px; background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    .summary-perk { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: 12px; }
    .summary-perk svg { color: var(--success); flex-shrink: 0; }

    /* Step 2 + 3 placeholders */
    .step-pad { padding: 60px 32px; text-align: center; color: var(--muted); }
    .step-pad .ico { width: 64px; height: 64px; border-radius: 999px; background: var(--primary-10); color: var(--primary);
      display: grid; place-items: center; margin: 0 auto 16px; }
    .step-pad .ico.ok { background: rgba(46,204,113,.15); color: var(--success); }
    .step-pad h2 { font-size: 24px; font-weight: 600; color: var(--primary); margin-bottom: 8px; }
    .step-pad p { max-width: 44ch; margin: 0 auto 24px; font-size: 14px; line-height: 1.65; }
    .conf-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 520px; margin: 0 auto 24px; padding: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
    @media (max-width: 540px) { .conf-meta { grid-template-columns: 1fr; } }
    .conf-meta .item { text-align: left; }
    .conf-meta .item .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .conf-meta .item .val { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--primary); margin-top: 2px; }
    .conf-actions { display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    /* Card preview (step 2) */
    .pay-tabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 12px; padding: 4px; background: #fff; margin-bottom: 24px; max-width: 100%; }
    .pay-tab { flex: 1; padding: 12px 14px; border-radius: 8px; border: 0; background: transparent; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, color .15s; }
    .pay-tab:hover { color: var(--text); }
    .pay-tab.active { background: var(--primary); color: #fff; }

    /* Footer */
    footer { background: var(--primary); color: rgba(255,255,255,.75); padding: 80px 0 28px; }
    footer h4 { color: #fff; font-family: var(--display); font-size: 16px; font-weight: 600; margin: 0 0 18px; letter-spacing: .01em; }
    .foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 56px; }
    @media (max-width: 980px) { .foot-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .foot-grid { grid-template-columns: 1fr; } }
    .foot-grid ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 11px; font-size: 14px; }
    .foot-grid ul a:hover { color: var(--accent); }
    .foot-brand { font-family: var(--display); font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -.01em; }
    .foot-brand .dot { color: var(--accent); }
    .foot-tag { color: rgba(255,255,255,.65); margin: 12px 0 20px; font-size: 14px; max-width: 32ch; }
    .foot-social { display: flex; gap: 10px; }
    .foot-social a { width: 38px; height: 38px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
      display: grid; place-items: center; transition: background .15s, border-color .15s, color .15s; color: rgba(255,255,255,.8); }
    .foot-social a:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .foot-bar { border-top: 1px solid rgba(255,255,255,.10); padding-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; color: rgba(255,255,255,.55); font-size: 13px; }
    .foot-bar .links { display: flex; gap: 24px; }
    .foot-bar a:hover { color: #fff; }

    /* Toast */
    .toast { position: fixed; top: 88px; left: 50%; transform: translateX(-50%) translateY(-12px); opacity: 0;
      background: var(--primary); color: #fff; padding: 12px 20px; border-radius: var(--r-pill);
      box-shadow: 0 12px 32px rgba(15,42,42,.4); z-index: 200; font-size: 14px;
      transition: opacity .25s var(--ease), transform .25s var(--ease); pointer-events: none;
      display: inline-flex; align-items: center; gap: 10px; }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .ok { width: 18px; height: 18px; border-radius: 999px; background: var(--success); color: #fff; display: grid; place-items: center; font-size: 11px; }

    .fade-in { animation: fadeIn .35s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    button:focus-visible, input:focus-visible, [role="button"]:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="booking.jsx"></script>
</body>
</html>

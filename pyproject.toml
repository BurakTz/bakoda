[tool.poetry]
name = "bakoda"
version = "0.1.0"
description = "Hotel Room Booking — MTH2526-B25 Dönem Projesi"
authors = ["Burak Tuzcu <burak4160@icloud.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
alembic = "^1.14.0"
boto3 = "^1.35.0"
pydantic = { version = "^2.10.0", extras = ["email"] }
pydantic-settings = "^2.7.0"
python-dotenv = "^1.0.0"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
# passlib 1.7.4 is incompatible with bcrypt 4.1+ (__about__ removed)
bcrypt = ">=4.0.1,<4.1"
python-multipart = "^0.0.9"
prometheus-fastapi-instrumentator = "^7.0.0"
opentelemetry-sdk = "^1.29.0"
opentelemetry-instrumentation-fastapi = "^0.50b0"
opentelemetry-instrumentation-sqlalchemy = "^0.50b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.29.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
httpx = "^0.28.0"
testcontainers = { version = "^4.9.0", extras = ["postgres"] }
factory-boy = "^3.3.0"
faker = "^33.0.0"
playwright = "^1.49.0"
pytest-playwright = "^0.6.0"
coverage = { version = "^7.6.0", extras = ["toml"] }
pytest-cov = "^6.0.0"
ruff = "^0.9.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
base_url = "http://localhost:8000"
markers = [
    "playwright: browser UI tests (pytest-playwright; requires running app)",
    "localstack: requires LocalStack S3 (S3_ENDPOINT_URL or testcontainers)",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# Repo kökündeki alembic/ klasörü ruff sürümleri arasında alembic'i
# first-party/third-party olarak farklı algılatıyor; sabitliyoruz.
known-third-party = ["alembic"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="720" fill="#f8fafc"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Bakoda  Hotel Room Booking  System Architecture</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#64748b">MTH2526-B25 " FastAPI " PostgreSQL " LocalStack S3 " Prometheus/Grafana " Jaeger " K8s " CI</text>

  <!-- Client / E2E -->
  <rect x="40" y="90" width="200" height="70" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="140" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Browser / Client</text>
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#475569">React static UI (frontend/)</text>

  <!-- FastAPI -->
  <rect x="300" y="80" width="240" height="100" rx="10" fill="url(#apiGrad)" stroke="#1e40af"/>
  <text x="420" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">FastAPI (Uvicorn)</text>
  <text x="420" y="135" text-anchor="middle" font-size="11" fill="#dbeafe">/api/rooms, /bookings, /auth, /hotels</text>
  <text x="420" y="152" text-anchor="middle" font-size="11" fill="#dbeafe">/metrics " OpenTelemetry spans</text>
  <text x="420" y="169" text-anchor="middle" font-size="10" fill="#bfdbfe">prometheus-fastapi-instrumentator</text>

  <!-- PostgreSQL -->
  <rect x="620" y="80" width="180" height="90" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="710" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">PostgreSQL 16</text>
  <text x="710" y="135" text-anchor="middle" font-size="11" fill="#047857">SQLAlchemy 2.x + Alembic</text>
  <text x="710" y="152" text-anchor="middle" font-size="10" fill="#059669">Hotel, Room, Booking, User&</text>

  <!-- LocalStack S3 -->
  <rect x="860" y="80" width="200" height="90" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="960" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">LocalStack S3</text>
  <text x="960" y="135" text-anchor="middle" font-size="11" fill="#c2410c">bakoda-confirmations</text>
  <text x="960" y="152" text-anchor="middle" font-size="10" fill="#ea580c">boto3 " confirmation JSON</text>

  <!-- Arrows top row -->
  <line x1="240" y1="125" x2="298" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="125" x2="618" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="125" x2="858" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Observability box -->
  <rect x="40" y="210" width="1020" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="60" y="235" font-size="13" font-weight="700" fill="#475569">OBSERVABILITY</text>

  <rect x="60" y="250" width="200" height="90" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="160" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Prometheus</text>
  <text x="160" y="305" text-anchor="middle" font-size="10" fill="#b91c1c">scrapes /metrics :9090</text>
  <text x="160" y="322" text-anchor="middle" font-size="10" fill="#dc2626">monitoring/prometheus.yml</text>

  <rect x="290" y="250" width="200" height="90" rx="8" fill="#faf5ff" stroke="#a855f7"/>
  <text x="390" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">Grafana</text>
  <text x="390" y="305" text-anchor="middle" font-size="10" fill="#7e22ce">:3000 " 3 panels</text>
  <text x="390" y="322" text-anchor="middle" font-size="10" fill="#9333ea">latency, errors, throughput</text>

  <rect x="520" y="250" width="200" height="90" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="620" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Jaeger</text>
  <text x="620" y="305" text-anchor="middle" font-size="10" fill="#b45309">OTLP gRPC :4317</text>
  <text x="620" y="322" text-anchor="middle" font-size="10" fill="#d97706">UI :16686 " bonus tracing</text>

  <line x1="420" y1="180" x2="160" y2="248" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="420" y1="180" x2="620" y2="248" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="260" y1="295" x2="288" y2="295" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Testing box -->
  <rect x="40" y="390" width="500" height="160" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="60" y="415" font-size="13" font-weight="700" fill="#1e40af">TEST PYRAMID</text>
  <text x="70" y="440" font-size="11" fill="#1e3a8a">" Unit (pytest): booking_service, room_service, schemas (~18)</text>
  <text x="70" y="460" font-size="11" fill="#1e3a8a">" Integration: Testcontainers PostgreSQL + httpx AsyncClient (~49)</text>
  <text x="70" y="480" font-size="11" fill="#1e3a8a">" E2E: Playwright API (5 scenarios)  health, book, conflict, cancel</text>
  <text x="70" y="500" font-size="11" fill="#1e3a8a">" Factory Boy + Faker: RoomFactory, BookingFactory</text>
  <text x="70" y="520" font-size="11" fill="#1e3a8a">" Postman/Newman: 7 requests (postman/collection.json)</text>
  <text x="70" y="540" font-size="11" fill="#1e3a8a">" k6: perf/load-test.js  p95 &lt; 500ms threshold</text>

  <!-- CI/CD box -->
  <rect x="560" y="390" width="500" height="160" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="580" y="415" font-size="13" font-weight="700" fill="#166534">CI/CD &amp; DEPLOY</text>
  <text x="590" y="440" font-size="11" fill="#14532d">GitHub Actions (planned): lint ’ pytest --cov ’ docker build</text>
  <text x="590" y="460" font-size="11" fill="#14532d">’ Newman smoke ’ Minikube deploy (kubectl apply -f k8s/)</text>
  <text x="590" y="480" font-size="11" fill="#14532d">Multi-stage Dockerfile (python:3.12-slim, non-root user)</text>
  <text x="590" y="500" font-size="11" fill="#14532d">docker-compose.yml: app + postgres + localstack + prom + grafana + jaeger</text>
  <text x="590" y="520" font-size="11" fill="#14532d">K8s: Deployment (2 replicas), Service, ConfigMap</text>
  <text x="590" y="540" font-size="11" fill="#14532d">Probes: /health liveness &amp; readiness</text>

  <!-- K8s cluster -->
  <rect x="40" y="580" width="1020" height="110" rx="12" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="60" y="605" font-size="13" font-weight="700" fill="#3730a3">KUBERNETES (Minikube)</text>
  <rect x="80" y="620" width="140" height="55" rx="6" fill="#fff" stroke="#818cf8"/>
  <text x="150" y="652" text-anchor="middle" font-size="11" font-weight="600">Deployment</text>
  <rect x="250" y="620" width="120" height="55" rx="6" fill="#fff" stroke="#818cf8"/>
  <text x="310" y="652" text-anchor="middle" font-size="11" font-weight="600">Service</text>
  <rect x="400" y="620" width="130" height="55" rx="6" fill="#fff" stroke="#818cf8"/>
  <text x="465" y="652" text-anchor="middle" font-size="11" font-weight="600">ConfigMap</text>
  <text x="600" y="652" font-size="11" fill="#4338ca">Image: bakoda:latest " prometheus.io/scrape annotations</text>
  <text x="600" y="672" font-size="10" fill="#6366f1">minikube service bakoda-service --url</text>
</svg>
